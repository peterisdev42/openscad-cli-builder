name: Delete two obsolete CLI Releases and their Git tags (one-time)

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-cli-history-once.yml

permissions:
  contents: write

jobs:
  delete-obsolete-cli-releases:
    runs-on: ubuntu-22.04
    steps:
      - name: Delete the two old Release records
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release delete openscad-cli-2021.01 --yes
          gh release delete openscad-cli-2026.10-TEST4 --yes
      - name: Delete the two old builder Git tags
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api -X DELETE "repos/$GH_REPO/git/refs/tags/openscad-cli-2021.01"
          gh api -X DELETE "repos/$GH_REPO/git/refs/tags/openscad-cli-2026.10-TEST4"
      - name: Verify old Release and tag names are gone
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO/releases?per_page=100" --jq 'length')" = "0"
          test "$(gh api "repos/$GH_REPO/git/matching-refs/tags" --jq 'length')" = "0"
