# Temporary one-shot dispatcher for the historical 2021.01 release.
# Delete after the requested run has been queued.
name: Dispatch OpenSCAD 2021.01 build (one-time)

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/dispatch-openscad-2021-once.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-22.04
    steps:
      - name: Start historical OpenSCAD 2021.01 build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh workflow run openscad-cli.yml --ref main -f source_tag=openscad-2021.01
