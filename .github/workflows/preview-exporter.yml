name: Package OpenSCAD Preview Exporter (macOS ARM64)

on:
  # Run this workflow from main once via a deliberately marked commit.
  # Arbitrary main pushes cannot publish the pinned RC0 release.
  push:
    branches:
      - main
    paths:
      - .github/workflows/preview-exporter.yml
  pull_request:
    paths:
      - .github/workflows/preview-exporter.yml
      - scripts/openscad-ci/build.py
      - scripts/openscad-ci/preview_exporter/**
      - scripts/openscad-ci/test_preview*.py
  workflow_dispatch:
    inputs:
      source_tag:
        description: Official OpenSCAD tag (RC0 pinned for the initial exporter ABI)
        required: true
        type: choice
        default: openscad-2026.11-RC0
        options:
          - openscad-2026.11-RC0

permissions:
  contents: read

concurrency:
  group: preview-exporter-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: '1'
  OPENSCAD_TAG: openscad-2026.11-RC0
  OPENSCAD_COMMIT: 9ba0cee7c94785fac0ca8dfe040b965a12a25ed1
  VCPKG_COMMIT: 6f7ffeb18f99796233b958aaaf14ec7bd4fb64b2
  SCAD_PREVIEW_EXPORTER: '1'
  TARGET: macos-arm64
  TRIPLET: arm64-osx

jobs:
  build-preview-exporter:
    name: Preview Exporter · macOS ARM64
    if: github.event_name != 'push' || github.event.head_commit.message == 'ci(preview-exporter): run RC0 release build'
    runs-on: macos-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: openscad/openscad
          ref: ${{ env.OPENSCAD_COMMIT }}
          path: sources/openscad
          submodules: recursive
      - name: Verify exact upstream source and architecture
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          test "$(git -C sources/openscad rev-parse 'HEAD^{commit}')" = "$OPENSCAD_COMMIT"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          architecture: arm64
      - name: Select Apple Silicon toolchain
        run: |
          sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer
          echo "CC=$(xcrun --find clang)" >> "$GITHUB_ENV"
          echo "CXX=$(xcrun --find clang++)" >> "$GITHUB_ENV"
          xcrun clang++ --version
      - name: Install macOS build tools
        run: |
          brew install bison flex pkg-config autoconf autoconf-archive automake libtool ccache gettext
          {
            echo "$(brew --prefix bison)/bin"
            echo "$(brew --prefix flex)/bin"
            echo "$(brew --prefix gettext)/bin"
          } >> "$GITHUB_PATH"
          echo "ACLOCAL_PATH=$(brew --prefix)/share/aclocal" >> "$GITHUB_ENV"
      - name: Install pinned build tooling
        run: python -m pip install cmake==3.31.6 ninja==1.11.1.3 meson==1.7.0 Mako==1.3.9 PyYAML==6.0.2 packaging==24.2
      - uses: actions/checkout@v5
        with:
          repository: microsoft/vcpkg
          ref: 6f7ffeb18f99796233b958aaaf14ec7bd4fb64b2
          path: .build/vcpkg
      - uses: actions/cache/restore@v5
        id: dependency-cache
        with:
          path: |
            .build/vcpkg-cache
            .build/ccache
          key: preview-deps-macos-arm64-${{ env.VCPKG_COMMIT }}-${{ hashFiles('scripts/openscad-ci/vcpkg.json', 'scripts/openscad-ci/triplets/**') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            openscad-deps-v2-macos-arm64-${{ env.VCPKG_COMMIT }}-${{ hashFiles('scripts/openscad-ci/vcpkg.json', 'scripts/openscad-ci/triplets/**') }}-
            preview-deps-macos-arm64-${{ env.VCPKG_COMMIT }}-
      - name: Verify injection against RC0 source
        run: python3 -m unittest discover -s scripts/openscad-ci -p 'test_preview*.py' -v
      - name: Build exporter, test relocated archive and Boolean products
        env:
          VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.build/vcpkg-cache,readwrite
          CCACHE_DIR: ${{ github.workspace }}/.build/ccache
          CCACHE_BASEDIR: ${{ github.workspace }}
        run: python3 scripts/openscad-ci/build.py
      - name: Save dependency cache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: |
            .build/vcpkg-cache
            .build/ccache
          key: ${{ steps.dependency-cache.outputs.cache-primary-key }}
      - name: Verify exporter release package
        run: python3 scripts/openscad-ci/preview_exporter/verify_release.py dist
      - uses: actions/upload-artifact@v6
        with:
          name: openscad-preview-exporter-macos-arm64
          path: dist/openscad-preview-exporter-macos-arm64.tar.gz*
          if-no-files-found: error
          retention-days: 14
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: preview-exporter-diagnostics-macos-arm64
          include-hidden-files: true
          path: |
            dist/*
            .build/**/*.log
            .build/**/CMakeCache.txt
          if-no-files-found: ignore

  publish-preview-exporter:
    name: Publish standalone Preview Exporter release
    needs: build-preview-exporter
    if: (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.event.head_commit.message == 'ci(preview-exporter): run RC0 release build')) && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          name: openscad-preview-exporter-macos-arm64
          path: dist
      - name: Verify archive, checksum and source metadata
        run: python3 scripts/openscad-ci/preview_exporter/verify_release.py dist
      - name: Publish only after remote download and full archive verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/openscad-ci/preview_exporter/publish.py dist
