name: Rebuild OpenSCAD 2021 before 2026 (one-time)

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/rebuild-in-order-once.yml

permissions:
  contents: read
  actions: write

jobs:
  build-chronologically:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Trigger and verify 2021.01, then 2026.10-TEST4
        shell: bash
        run: |
          set -euo pipefail
          for tag in openscad-2021.01 openscad-2026.10-TEST4; do
            previous="$(gh run list --workflow openscad-cli.yml --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
            echo "Requesting build for $tag"
            gh workflow run openscad-cli.yml --ref main -f source_tag="$tag"
            run_id=""
            for i in {1..90}; do
              candidate="$(gh run list --workflow openscad-cli.yml --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
              if [[ -n "$candidate" && "$candidate" != "$previous" ]]; then
                run_id="$candidate"
                break
              fi
              sleep 5
            done
            test -n "$run_id"
            echo "Monitoring $tag: https://github.com/$GH_REPO/actions/runs/$run_id"
            gh run watch "$run_id" --exit-status --interval 30

            expected_title="2021.01.31"
            if [[ "$tag" == openscad-2026.10-TEST4 ]]; then
              expected_title="2026.10.15-TEST4"
            fi
            title="$(gh api "repos/$GH_REPO/releases/tags/$tag" --jq .name)"
            assets="$(gh api "repos/$GH_REPO/releases/tags/$tag" --jq '.assets | length')"
            test "$title" = "$expected_title"
            test "$assets" = "12"
            echo "Published $tag as $title with 12 assets."
          done
          test "$(gh api "repos/$GH_REPO/releases?per_page=2" --jq '.[0].tag_name')" = "openscad-2026.10-TEST4"
          test "$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name)" = "openscad-2026.10-TEST4"
          echo "Verified 2026 is top and Latest."
