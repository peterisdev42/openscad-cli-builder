# Temporary workflow to remove one published Release while preserving its Git tag.
name: Delete OpenSCAD CLI 2026.10-TEST4 Release (one-time)

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/remove-2026-release-once.yml

permissions:
  contents: write

jobs:
  delete-release:
    runs-on: ubuntu-22.04
    steps:
      - name: Delete only the requested Release, preserving its Git tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release view openscad-cli-2026.10-TEST4 >/dev/null
          gh release delete openscad-cli-2026.10-TEST4 --yes
          if gh release view openscad-cli-2026.10-TEST4 >/dev/null 2>&1; then
            echo "Error: requested release still exists." >&2
            exit 1
          fi
          gh release view openscad-cli-2021.01 >/dev/null
          echo "2026.10-TEST4 Release deleted. Git tag preserved; 2021.01 retained."
