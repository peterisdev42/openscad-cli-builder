name: Windows Unicode candidate ZIP diagnostics

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  candidate:
    strategy:
      fail-fast: false
      matrix:
        image: [windows-2022, windows-2025]
    runs-on: ${{ matrix.image }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          architecture: x64
      - uses: actions/download-artifact@v7
        with:
          name: logs-windows-x64
          github-token: ${{ github.token }}
          run-id: 45353591562
          path: prior
      - name: Confirm original candidate and run all 15 probe cases
        env:
          SCAD_WINDOWS_RUNNER: ${{ matrix.image }}
        shell: pwsh
        run: |
          $zip = 'prior/dist/openscad-cli-windows-x86_64.zip'
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne 'f9b5e32ce9379a2ac2b4631eb3dd0d7173b31f298ecaf9d0f2386dee0f8dd342') {
            throw 'ZIP SHA256 mismatch'
          }
          python scripts/openscad-ci/windows_unicode_probe.py --archive $zip --output native-report.json
      - name: Isolate smoke model operations
        if: always()
        shell: pwsh
        run: python scripts/openscad-ci/diagnostics/candidate_inputs.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: diagnostic-zip-${{ matrix.image }}
          path: |
            native-report.json
            input-report.json
            cdb.log
          if-no-files-found: error
